---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: lab
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16

  # Allow Postgres pods onto the spot node pool.
  affinity:
    tolerations:
    - key: kubernetes.azure.com/scalesetpriority
      operator: Equal
      value: spot
      effect: NoSchedule

  storage:
    size: 5Gi
    storageClass: managed-csi

  bootstrap:
    initdb:
      database: appdb
      owner: appuser
      # Apply the application schema right after the database is created.
      postInitApplicationSQLRefs:
        configMapRefs:
        - name: postgres-schema
          key: schema.sql

  backup:
    barmanObjectStore:
      endpointURL: http://minio.lab.svc.cluster.local:9000
      destinationPath: s3://postgres-backups/
      s3Credentials:
        accessKeyId:
          name: minio-credentials
          key: access-key
        secretAccessKey:
          name: minio-credentials
          key: secret-key
      wal:
        compression: gzip
      data:
        compression: gzip

---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-backup
  namespace: lab
spec:
  schedule: "0 2 * * *"
  cluster:
    name: postgres
  backupOwnerReference: self

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-schema
  namespace: lab
data:
  schema.sql: |
    -- Incident audit log. The doom dashboard upserts ServiceNow incidents here
    -- (keyed on incident number) so PostgreSQL is the local system of record:
    -- first_seen / last_seen track when each incident was observed.
    CREATE TABLE IF NOT EXISTS incident_log (
      number TEXT PRIMARY KEY,
      short_description TEXT,
      priority TEXT,
      state TEXT,
      first_seen TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      last_seen TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    GRANT SELECT, INSERT, UPDATE, DELETE ON incident_log TO appuser;
