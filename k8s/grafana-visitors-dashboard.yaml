apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-visitors-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Lab"
data:
  visitors.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "panels": [
        {
          "id": 1,
          "title": "External visits (selected range)",
          "type": "stat",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "targets": [
            {
              "expr": "sum(count_over_time({namespace=\"lab\", app=\"doom-dashboard\", container=\"nginx\"} |= \"HTTP/\" != \"kube-probe\" != \"Uptime-Kuma\" | pattern `<ip> - - [<_>] \"<method> <path> <_>\" <status> <_>` | ip !~ `10\\..+` | ip !~ `172\\.(1[6-9]|2[0-9]|3[01])\\..+` | ip !~ `192\\.168\\..+` | ip !~ `127\\..+` | ip !~ `169\\.254\\..+` [$__range]))",
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "queryType": "instant",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          }
        },
        {
          "id": 2,
          "title": "Visits over time",
          "type": "timeseries",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 18,
            "h": 6
          },
          "targets": [
            {
              "expr": "sum(count_over_time({namespace=\"lab\", app=\"doom-dashboard\", container=\"nginx\"} |= \"HTTP/\" != \"kube-probe\" != \"Uptime-Kuma\" | pattern `<ip> - - [<_>] \"<method> <path> <_>\" <status> <_>` | ip !~ `10\\..+` | ip !~ `172\\.(1[6-9]|2[0-9]|3[01])\\..+` | ip !~ `192\\.168\\..+` | ip !~ `127\\..+` | ip !~ `169\\.254\\..+` [$__interval]))",
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "queryType": "range"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 40
              }
            }
          }
        },
        {
          "id": 3,
          "title": "Top visitor IPs",
          "type": "table",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 11
          },
          "targets": [
            {
              "expr": "topk(25, sum by (ip) (count_over_time({namespace=\"lab\", app=\"doom-dashboard\", container=\"nginx\"} |= \"HTTP/\" != \"kube-probe\" != \"Uptime-Kuma\" | pattern `<ip> - - [<_>] \"<method> <path> <_>\" <status> <_>` | ip !~ `10\\..+` | ip !~ `172\\.(1[6-9]|2[0-9]|3[01])\\..+` | ip !~ `192\\.168\\..+` | ip !~ `127\\..+` | ip !~ `169\\.254\\..+` [$__range])))",
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "queryType": "instant",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 4,
          "title": "Top paths",
          "type": "table",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 11
          },
          "targets": [
            {
              "expr": "topk(15, sum by (path) (count_over_time({namespace=\"lab\", app=\"doom-dashboard\", container=\"nginx\"} |= \"HTTP/\" != \"kube-probe\" != \"Uptime-Kuma\" | pattern `<ip> - - [<_>] \"<method> <path> <_>\" <status> <_>` | ip !~ `10\\..+` | ip !~ `172\\.(1[6-9]|2[0-9]|3[01])\\..+` | ip !~ `192\\.168\\..+` | ip !~ `127\\..+` | ip !~ `169\\.254\\..+` [$__range])))",
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "queryType": "instant",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 5,
          "title": "Recent visitor requests",
          "type": "logs",
          "datasource": {
            "type": "loki",
            "uid": "P8E80F9AEF21F6940"
          },
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 24,
            "h": 13
          },
          "targets": [
            {
              "expr": "{namespace=\"lab\", app=\"doom-dashboard\", container=\"nginx\"} |= \"HTTP/\" != \"kube-probe\" != \"Uptime-Kuma\" | pattern `<ip> - - [<_>] \"<method> <path> <_>\" <status> <_>` | ip !~ `10\\..+` | ip !~ `172\\.(1[6-9]|2[0-9]|3[01])\\..+` | ip !~ `192\\.168\\..+` | ip !~ `127\\..+` | ip !~ `169\\.254\\..+`",
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "P8E80F9AEF21F6940"
              },
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          }
        }
      ],
      "schemaVersion": 39,
      "tags": [
        "lab",
        "visitors"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {},
      "title": "Visitors",
      "uid": "lab-visitors",
      "version": 2
    }
