# CloudNativePG-managed PgBouncer connection pooler.
# The operator manages the PgBouncer image, deployment, and authentication
# against the postgres cluster — no hand-rolled image or SCRAM userlist needed.
#
# Creates a Service named "postgres-pooler-rw" on port 5432 that routes to the
# current primary. Applications connect here instead of directly to PostgreSQL.
#
# Auth uses the auth_query mechanism: a dedicated cnpg_pooler_pgbouncer role and
# a user_search SECURITY DEFINER function must exist in the cluster (see README /
# the "Configure Pooler auth" step). The operator wires the rest automatically.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: postgres-pooler-rw
  namespace: lab
spec:
  cluster:
    name: postgres
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "100"
      default_pool_size: "20"
  template:
    spec:
      containers:
      - name: pgbouncer
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
