# Default deny all ingress and egress in the lab namespace.
# Specific allow rules below selectively open only what each workload needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: lab
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Allow DNS egress from every pod in lab (required for service discovery).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: lab
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
# nginx: accept traffic from nginx-gateway only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx
  namespace: lab
spec:
  podSelector:
    matchLabels:
      app: nginx
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: nginx-gateway
    ports:
    - port: 8080
      protocol: TCP
---
# doom: accept traffic from doom-dashboard only (proxied by nginx sidecar).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-doom
  namespace: lab
spec:
  podSelector:
    matchLabels:
      app: doom
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: doom-dashboard
    ports:
    - port: 8000
      protocol: TCP
---
# doom-dashboard: accept traffic from nginx-gateway.
# Egress: reach doom (game backend), pgbouncer, uptimekuma, and Prometheus in monitoring namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-doom-dashboard
  namespace: lab
spec:
  podSelector:
    matchLabels:
      app: doom-dashboard
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: nginx-gateway
    ports:
    - port: 8080
      protocol: TCP
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: doom
    ports:
    - port: 8000
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          cnpg.io/poolerName: postgres-pooler-rw
    ports:
    - port: 5432
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app: uptimekuma
    ports:
    - port: 3001
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: 9090
      protocol: TCP
    - port: 3100
      protocol: TCP
  - ports:
    - port: 443
      protocol: TCP
---
# uptimekuma: accept traffic from nginx-gateway and doom-dashboard (metrics query).
# Egress is fully open — uptime-kuma pings arbitrary external endpoints.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-uptimekuma
  namespace: lab
spec:
  podSelector:
    matchLabels:
      app: uptimekuma
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: nginx-gateway
    - podSelector:
        matchLabels:
          app: doom-dashboard
    ports:
    - port: 3001
      protocol: TCP
  egress:
  - {}
---
# postgres-cluster: accept connections from any pod in the lab namespace on port 5432.
# CloudNativePG pods carry the cnpg.io/cluster label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: lab
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - port: 5432
      protocol: TCP
---
# pgbouncer (CNPG Pooler): accept connections from any pod in the lab namespace on port 5432.
# Egress: reach CloudNativePG cluster pods on port 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgbouncer
  namespace: lab
spec:
  podSelector:
    matchLabels:
      cnpg.io/poolerName: postgres-pooler-rw
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - port: 5432
      protocol: TCP
  egress:
  - to:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: postgres
    ports:
    - port: 5432
      protocol: TCP
---
# minio: accept connections from any pod in the lab namespace on port 9000.
# Egress on postgres-cluster pods: reach minio on port 9000 (e.g. for WAL archiving / backups).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio
  namespace: lab
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - port: 9000
      protocol: TCP
  egress:
  - to:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: postgres
    ports:
    - port: 9000
      protocol: TCP
