apiVersion: v1
kind: ConfigMap
metadata:
  name: doom-dashboard-nginx
  namespace: lab
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        server_tokens off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-src 'self'; connect-src 'self'" always;

        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location /doom/ {
            proxy_pass http://doom:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_hide_header X-Frame-Options;
            proxy_read_timeout 60s;
            # Override server-level headers for the game proxy.
            # Any add_header in a location block replaces ALL server-level
            # add_header directives for that location, so we re-declare what
            # we need and use a permissive CSP that allows WebAssembly.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' blob: data:; connect-src 'self';" always;
        }

        location /metrics-data {
            proxy_pass http://127.0.0.1:9091/metrics-data;
            proxy_read_timeout 6s;
        }

        location /whoami {
            proxy_pass http://127.0.0.1:9091/whoami;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 8s;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: doom-dashboard-metrics
  namespace: lab
data:
  metrics_server.py: |
    #!/usr/bin/env python3
    import json, re, time, threading, urllib.request, urllib.parse, os, base64
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    PROM      = "http://kube-prometheus-stack-prometheus.monitoring:9090/api/v1/query"
    PROM_RANGE = "http://kube-prometheus-stack-prometheus.monitoring:9090/api/v1/query_range"
    UK_URL    = "http://uptimekuma.lab:3001"
    UK_KEY    = os.environ.get('UPTIME_KUMA_API_KEY', '')

    SCALARS = {
        "cpu":    '100 - avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100',
        "mem":    '(1 - avg(node_memory_MemAvailable_bytes)/avg(node_memory_MemTotal_bytes)) * 100',
        "rps":    'sum(rate(container_network_receive_bytes_total{namespace="lab",pod=~"doom-.+",interface!="lo"}[2m]))',
        "hits5m": 'sum(increase(container_network_receive_bytes_total{namespace="lab",pod=~"doom-.+",interface!="lo"}[5m]))',
        "hits1h": 'sum(increase(container_network_receive_bytes_total{namespace="lab",pod=~"doom-.+",interface!="lo"}[1h]))',
        "pods":   'sum(kube_pod_status_phase{phase="Running"})',
        "nodes":  'count(kube_node_info)',
        "ns":     'count(kube_namespace_labels)',
    }
    INGRESS_Q = 'sort_desc(sum by (pod)(rate(container_network_receive_bytes_total{namespace="lab",interface!="lo"}[2m])))'
    PODS_Q    = 'kube_pod_status_phase == 1'
    LOKI      = "http://loki-stack.monitoring:3100"
    CHART_QUERIES = {
        "doom_cpu": 'rate(container_cpu_usage_seconds_total{container="doom",namespace="lab"}[1m]) * 100',
        "doom_rx":  'sum(rate(container_network_receive_bytes_total{namespace="lab",pod=~"doom-.+",interface!="lo"}[1m]))',
    }

    # Match only the leading $remote_addr in nginx access log lines.
    # Scanning the full line picks up IPs in User-Agent strings (e.g. Chrome/148.0.0.0).
    SKIP_IPS = {'168.63.129.16'}  # Azure LB health probe
    WHOAMI_CACHE = {}  # ip -> geo info dict

    def _is_public(ip):
        if ip in SKIP_IPS:
            return False
        return not re.match(r'^(10\.|172\.(1[6-9]|2\d|3[01])\.|192\.168\.|127\.|100\.|169\.254\.)', ip)

    def _whoami_geo(ip):
        if ip in WHOAMI_CACHE:
            return WHOAMI_CACHE[ip]
        info = {}
        try:
            req = urllib.request.Request(
                f"https://ipwho.is/{ip}",
                headers={"User-Agent": "doom-dashboard/1.0"})
            with urllib.request.urlopen(req, timeout=5) as r:
                d = json.load(r)
            if d.get("success"):
                conn = d.get("connection") or {}
                tz   = d.get("timezone") or {}
                flag = d.get("flag") or {}
                info = {
                    "city":         d.get("city", ""),
                    "region":       d.get("region", ""),
                    "country":      d.get("country", ""),
                    "country_code": (d.get("country_code") or "").lower(),
                    "flag":         flag.get("emoji", ""),
                    "isp":          conn.get("isp", "") or conn.get("org", ""),
                    "asn":          ("AS%s" % conn.get("asn")) if conn.get("asn") else "",
                    "timezone":     tz.get("id", ""),
                }
                WHOAMI_CACHE[ip] = info   # cache successful lookups only
        except Exception:
            info = {}
        return info

    _cache  = {}
    _lock   = threading.Lock()

    def _query(q):
        url = PROM + "?query=" + urllib.parse.quote(q)
        with urllib.request.urlopen(url, timeout=5) as r:
            d = json.load(r)
        if d["status"] != "success":
            return []
        return d["data"]["result"]

    def _fetch():
        out = {}
        for k, q in SCALARS.items():
            try:
                rs = _query(q)
                out[k] = float(rs[0]["value"][1]) if rs else None
            except Exception:
                out[k] = None
        try:
            out["ingress"] = [
                {"pod": r["metric"].get("pod", "unknown"),
                 "rx": float(r["value"][1])}
                for r in _query(INGRESS_Q)
            ]
        except Exception:
            out["ingress"] = []
        try:
            pods_raw = _query(PODS_Q)
            out["pod_list"] = sorted([
                {"ns":    r["metric"].get("namespace", ""),
                 "pod":   r["metric"].get("pod", ""),
                 "phase": r["metric"].get("phase", "")}
                for r in pods_raw
            ], key=lambda x: (x["ns"], x["pod"]))
        except Exception:
            out["pod_list"] = []
        return out

    _UK_LINE_RE = re.compile(r'^(monitor_status|monitor_response_time)\{([^}]+)\}\s+([\d.]+)', re.M)
    _UK_LBL_RE  = re.compile(r'(\w+)="([^"]*)"')

    def _fetch_uptime():
        if not UK_KEY:
            return []
        creds = base64.b64encode(f"api:{UK_KEY}".encode()).decode()
        req = urllib.request.Request(
            UK_URL + "/metrics",
            headers={"Authorization": f"Basic {creds}", "Accept": "text/plain"})
        with urllib.request.urlopen(req, timeout=8) as r:
            raw = r.read().decode()
        monitors = {}
        for m in _UK_LINE_RE.finditer(raw):
            metric = m.group(1)
            labels = dict(_UK_LBL_RE.findall(m.group(2)))
            val    = float(m.group(3))
            name   = labels.get('monitor_name', '')
            if not name:
                continue
            if name not in monitors:
                monitors[name] = {'name': name, 'url': labels.get('monitor_url', ''),
                                  'status': None, 'ping': None, 'up24': None}
            if metric == 'monitor_status':
                monitors[name]['status'] = int(val)
            else:
                monitors[name]['ping'] = val
        return list(monitors.values())

    # Match explicit level field in logfmt, JSON, or nginx bracket format.
    # Excludes level=info lines -- only error/warn/fatal are included.
    _LVL_RE = re.compile(
        r'\blevel[=:"]+\s*(error|fatal|critical|warn|warning)\b'
        r'|"level"\s*:\s*"(error|fatal|critical|warn|warning)"'
        r'|\[(error|warn)\]', re.I)
    _MSG_RE = re.compile(r'\bmsg="([^"]+)"|\bmsg=([^\s}]+)|"msg"\s*:\s*"([^"]+)"', re.I)
    _TS_RE  = re.compile(r'^[\d\-T:.Z\s]{5,32}')
    # Nginx error log prefix: date [level] pid#tid: *cid message
    _NGX_PFX = re.compile(r'^\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2} \[\w+\] \d+#\d+: \*?\d* ?')

    def _log_level(line):
        m = _LVL_RE.search(line)
        if not m:
            return None
        hit = next(g for g in m.groups() if g).lower()
        return 'err' if hit in ('error', 'fatal', 'critical') else 'wrn'

    def _log_msg(line):
        m = _MSG_RE.search(line)
        if m:
            return next(g for g in m.groups() if g)
        s = _NGX_PFX.sub('', line)
        return _TS_RE.sub('', s).strip()

    def _fetch_logs():
        now_ns   = int(time.time() * 1_000_000_000)
        start_ns = now_ns - 15 * 60 * 1_000_000_000
        params   = urllib.parse.urlencode({
            "query": ('{namespace=~"lab|monitoring|cert-manager|ingress-nginx"}'
                      ' |~ "(?i)(level=(error|fatal|critical|warn|warning)|[[]error[]]|[[]warn[]]) "'),
            "limit": "100",
            "start": str(start_ns),
            "end":   str(now_ns),
            "direction": "backward",
        })
        with urllib.request.urlopen(LOKI + "/loki/api/v1/query_range?" + params, timeout=8) as r:
            data = json.load(r)
        best = {}
        for stream in data.get("data", {}).get("result", []):
            ns = stream.get("stream", {}).get("namespace", "")
            for ts_ns, line in stream.get("values", []):
                lvl = _log_level(line)
                if lvl is None:
                    continue
                ts_sec = int(ts_ns) // 1_000_000_000
                msg    = _log_msg(line)
                key    = (ns, msg[:50])
                if key not in best or ts_sec > best[key][0]:
                    best[key] = (ts_sec, ns, msg, lvl)
        result = []
        for ts_sec, ns, msg, lvl in sorted(best.values(), key=lambda x: x[0], reverse=True)[:15]:
            t = time.gmtime(ts_sec)
            result.append({"ts":  f"{t.tm_hour:02d}:{t.tm_min:02d}:{t.tm_sec:02d}",
                           "ns":  ns, "msg": msg[:90], "lvl": lvl})
        return result

    def _fetch_chart():
        end   = int(time.time())
        start = end - 5 * 60   # 5-minute live window
        step  = 10             # 10-second steps
        out   = {}
        for key, q in CHART_QUERIES.items():
            url = (PROM_RANGE + "?query=" + urllib.parse.quote(q)
                   + f"&start={start}&end={end}&step={step}s")
            try:
                with urllib.request.urlopen(url, timeout=8) as r:
                    d = json.load(r)
                series = d.get("data", {}).get("result", [])
                out[key] = [[int(v[0]), float(v[1])] for v in series[0]["values"]] if series else []
            except Exception as e:
                print(f"[chart] {key}: {e}", flush=True)
                out[key] = []
        return out

    _slow_tick    = 0
    _uptime_cache = []
    _chart_cache  = {}
    _log_cache    = []

    def _loop():
        global _slow_tick, _uptime_cache, _chart_cache, _log_cache
        while True:
            try:
                data = _fetch()
                if _slow_tick % 12 == 0:
                    try:
                        _uptime_cache[:] = _fetch_uptime()
                    except Exception as e:
                        print(f"[uk] fetch: {e}", flush=True)
                    try:
                        _log_cache[:] = _fetch_logs()
                    except Exception as e:
                        print(f"[log] fetch: {e}", flush=True)
                _slow_tick += 1
                try:
                    c = _fetch_chart()
                    _chart_cache.clear()
                    _chart_cache.update(c)
                except Exception as e:
                    print(f"[chart] fetch: {e}", flush=True)
                if _uptime_cache:
                    data['uptime'] = list(_uptime_cache)
                if _chart_cache:
                    data['chart'] = dict(_chart_cache)
                if _log_cache is not None:
                    data['logs'] = list(_log_cache)
                with _lock:
                    _cache.clear()
                    _cache.update(data)
                    _cache["ok"] = True
            except Exception as e:
                with _lock:
                    _cache["ok"] = False
                print(f"[metrics] error: {e}", flush=True)
            time.sleep(5)

    class _H(BaseHTTPRequestHandler):
        def log_message(self, *a): pass

        def _client_ip(self):
            # Cloudflare sets the real visitor IP; fall back through the proxy chain.
            ip = self.headers.get('CF-Connecting-IP', '').strip()
            if not ip:
                for part in self.headers.get('X-Forwarded-For', '').split(','):
                    cand = part.strip()
                    if cand and _is_public(cand):
                        ip = cand
                        break
            return ip or self.client_address[0]

        def _send_json(self, payload):
            body = json.dumps(payload).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/metrics-data":
                with _lock:
                    self._send_json(dict(_cache))
                return
            if self.path == "/whoami":
                ip = self._client_ip()
                payload = {"ip": ip}
                if _is_public(ip):
                    payload.update(_whoami_geo(ip))
                self._send_json(payload)
                return
            self.send_response(404)
            self.end_headers()

    threading.Thread(target=_loop, daemon=True).start()
    print("[metrics] server starting on 127.0.0.1:9091", flush=True)
    ThreadingHTTPServer(("127.0.0.1", 9091), _H).serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: doom-dashboard-html
  namespace: lab
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>doom dashboard</title>
      <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128128;</text></svg>">
      <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
          --red:#b81000;--rhi:#ff2200;--amb:#d08000;
          --grn:#00a848;--dim:#484848;--bdr:#202020;
          --bg:#080808;--bg2:#0e0e0e;--bg3:#161616;--tx:#c0c0c0
        }
        html,body{height:100%;background:var(--bg);color:var(--tx);
          font-family:'Courier New',monospace;font-size:16px;overflow:hidden}
        header{
          height:42px;background:var(--bg2);border-bottom:2px solid var(--red);
          display:flex;align-items:center;justify-content:space-between;padding:0 16px;
          flex-shrink:0
        }
        .h-logo{color:var(--rhi);font-weight:bold;letter-spacing:4px;font-size:13px;
          text-shadow:0 0 8px var(--rhi)}
        .h-right{display:flex;align-items:center;gap:18px;font-size:11px;color:var(--dim)}
        .dot{width:8px;height:8px;border-radius:50%;background:var(--grn);
          box-shadow:0 0 6px var(--grn);display:inline-block;margin-right:6px;
          animation:pulse 2s infinite}
        .dot.err{background:var(--rhi);box-shadow:0 0 6px var(--rhi);animation:none}
        .dot.init{background:var(--amb);box-shadow:0 0 6px var(--amb)}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        #statsbar{
          height:58px;background:var(--bg2);border-bottom:2px solid var(--bdr);
          display:flex;align-items:stretch;flex-shrink:0
        }
        .st{flex:1;text-align:center;display:flex;flex-direction:column;
          justify-content:center;border-right:1px solid var(--bdr);padding:4px 0}
        .st:last-child{border-right:none}
        .sv{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--amb)}
        .sv.ok{color:var(--grn)}.sv.warn{color:var(--amb)}.sv.crit{color:var(--rhi)}
        .sl{font-size:9px;letter-spacing:2px;color:var(--dim);margin-top:2px;text-transform:uppercase}
        #layout{display:flex;height:calc(100vh - 122px)}
        .col{
          width:310px;min-width:310px;background:var(--bg2);
          display:flex;flex-direction:column;overflow:hidden
        }
        .col:first-child{border-right:2px solid var(--bdr)}
        .col:last-child{border-left:2px solid var(--bdr)}
        #game{flex:1;background:#000;overflow:hidden;display:flex;flex-direction:column}
        #game iframe{flex:1;border:none;display:block;width:100%;min-height:0}
        #chart-panel{height:170px;background:var(--bg2);border-top:2px solid var(--bdr);flex-shrink:0;padding:6px 14px 8px;overflow:hidden}
        #chart-hd{font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
        .ch-leg{display:flex;gap:14px;font-size:10px;color:var(--dim)}
        .ch-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:middle}
        #mchart{display:block;width:100%}
        .sec{border-bottom:1px solid var(--bdr);padding:12px 14px;flex-shrink:0}
        .sec-hd{
          font-size:11px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;
          margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--bdr)
        }
        .brow{display:flex;align-items:center;margin-bottom:10px}
        .bl{width:44px;font-size:14px;color:var(--dim)}
        .bt{flex:1;height:10px;background:var(--bg3);margin:0 10px;border:1px solid #1a1a1a;border-radius:2px}
        .bf{height:100%;background:var(--grn);transition:width .6s ease;border-radius:2px}
        .bf.w{background:var(--amb)}.bf.c{background:var(--rhi)}
        .bv{width:46px;text-align:right;font-size:14px;color:var(--tx)}
        .rrow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
        .rl{font-size:14px;color:var(--dim)}
        .rv{font-size:28px;color:var(--amb);text-shadow:0 0 8px rgba(208,128,0,.3);font-variant-numeric:tabular-nums}
        .rv.sm{font-size:20px}
        #spark{display:flex;align-items:flex-end;gap:2px;height:48px;margin-top:10px}
        .sb{flex:1;background:var(--red);min-height:2px;border-radius:1px 1px 0 0;transition:height .4s ease}
        .inc-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
        .inc-row a{display:flex;align-items:center;gap:6px;text-decoration:none;flex:1;min-width:0;
          padding:3px 5px;border-radius:3px;transition:background .15s}
        .inc-row a:hover{background:#1a1a1a}
        .inc-badge{font-size:10px;font-weight:bold;flex-shrink:0;padding:1px 5px;border-radius:2px;letter-spacing:1px}
        .inc-badge.p1{background:rgba(255,34,0,.18);color:var(--rhi)}
        .inc-badge.p2{background:rgba(208,128,0,.18);color:var(--amb)}
        .inc-badge.p3{background:rgba(176,176,0,.15);color:#b0b000}
        .inc-badge.p4{background:rgba(72,72,72,.3);color:var(--dim)}
        .inc-num{font-size:10px;color:var(--dim);flex-shrink:0}
        .inc-desc{font-size:12px;color:var(--tx);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
        .irow{display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px}
        .iname{color:var(--dim);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
        .irps{color:var(--amb);margin-left:10px;flex-shrink:0}
        .uk-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
        .uk-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
        .uk-dot.up{background:var(--grn);box-shadow:0 0 4px var(--grn)}
        .uk-dot.down{background:var(--rhi);box-shadow:0 0 4px var(--rhi);animation:pulse 1.5s infinite}
        .uk-dot.unk{background:var(--dim)}
        .uk-name{flex:1;font-size:13px;color:var(--tx);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
        .uk-ping{font-size:12px;color:var(--amb);flex-shrink:0;font-variant-numeric:tabular-nums;width:46px;text-align:right}
        .uk-up{font-size:10px;color:var(--dim);flex-shrink:0;width:40px;text-align:right}
        a.uk-name{color:var(--tx);text-decoration:none}
        a.uk-name:hover{color:var(--grn);text-shadow:0 0 4px rgba(0,168,72,.5)}
        .you-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
        .you-k{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);flex-shrink:0}
        .you-v{font-size:13px;color:var(--tx);text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
        .you-v.hl{color:var(--amb);text-shadow:0 0 6px rgba(208,128,0,.25)}
        .you-v.ip{font-size:16px;color:var(--grn);text-shadow:0 0 6px rgba(0,168,72,.3)}
        #log-sec{padding:10px 14px;flex:1;overflow-y:auto;min-height:0;border-top:1px solid var(--bdr)}
        .log-row{display:flex;align-items:baseline;gap:5px;margin-bottom:4px;line-height:1.2}
        .log-lvl{font-size:9px;font-weight:bold;flex-shrink:0;width:16px;text-align:center;
          padding:1px 0;border-radius:2px;letter-spacing:0}
        .log-lvl.err{background:rgba(255,34,0,.18);color:var(--rhi)}
        .log-lvl.wrn{background:rgba(208,128,0,.18);color:var(--amb)}
        .log-ts{font-size:10px;color:var(--dim);flex-shrink:0;font-variant-numeric:tabular-nums;width:48px}
        .log-ns{font-size:10px;flex-shrink:0;width:56px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
        .log-msg{font-size:11px;color:var(--tx);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
        #pod-sec{padding:12px 14px;flex:1;overflow-y:auto;min-height:0;border-bottom:1px solid var(--bdr)}
        .pgrp{margin-bottom:10px}
        .pgrp-hd{
          font-size:10px;letter-spacing:2px;text-transform:uppercase;
          display:flex;justify-content:space-between;align-items:center;
          padding-bottom:4px;margin-bottom:4px;border-bottom:1px solid #1c1c1c
        }
        .pgrp-ct{font-size:12px;color:var(--dim)}
        .prow{display:flex;align-items:center;gap:7px;margin-bottom:3px}
        .pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
        .pdot.run{background:var(--grn);box-shadow:0 0 4px var(--grn)}
        .pdot.pend{background:var(--amb);box-shadow:0 0 4px var(--amb)}
        .pdot.fail{background:var(--rhi);box-shadow:0 0 4px var(--rhi)}
        .pname{font-size:13px;color:var(--tx);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
        #footer{padding:8px 14px;font-size:11px;color:#2a2a2a;
          border-top:1px solid var(--bdr);flex-shrink:0}
        ::-webkit-scrollbar{width:3px}
        ::-webkit-scrollbar-track{background:var(--bg2)}
        ::-webkit-scrollbar-thumb{background:#303030}
      </style>
    </head>
    <body>
    <header>
      <div class="h-logo">&#9760; DOOM DASHBOARD</div>
      <div class="h-right">
        <span><span class="dot init" id="dot"></span><span id="sts">INIT</span></span>
        <span id="ts">&mdash;</span>
      </div>
    </header>
    <div id="statsbar">
      <div class="st"><div class="sv" id="sc-pods">&mdash;</div><div class="sl">pods</div></div>
      <div class="st"><div class="sv" id="sc-nodes">&mdash;</div><div class="sl">nodes</div></div>
      <div class="st"><div class="sv" id="sc-cpu">&mdash;</div><div class="sl">cpu</div></div>
      <div class="st"><div class="sv" id="sc-mem">&mdash;</div><div class="sl">mem</div></div>
    </div>
    <div id="layout">
      <div class="col">
        <div class="sec">
          <div class="sec-hd">&#9889; node resources</div>
          <div class="brow">
            <div class="bl">CPU</div>
            <div class="bt"><div class="bf" id="cpu-b" style="width:0"></div></div>
            <div class="bv" id="cpu-v">&mdash;</div>
          </div>
          <div class="brow">
            <div class="bl">MEM</div>
            <div class="bt"><div class="bf" id="mem-b" style="width:0"></div></div>
            <div class="bv" id="mem-v">&mdash;</div>
          </div>
        </div>
        <div class="sec">
          <div class="sec-hd"><a href="https://status.hl0.dev/status/home" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">&#128994; uptime kuma</a></div>
          <div id="uk-list"><div class="uk-row"><span class="uk-name" style="color:#333">loading&hellip;</span></div></div>
        </div>
        <div class="sec">
          <div class="sec-hd">&#128128; doom traffic</div>
          <div class="rrow"><div class="rl">RX BYTES / S</div><div class="rv" id="rps">&mdash;</div></div>
          <div class="rrow"><div class="rl">RX &middot; 5 MIN</div><div class="rv sm" id="h5">&mdash;</div></div>
          <div class="rrow"><div class="rl">RX &middot; 1 HR</div><div class="rv sm" id="h1">&mdash;</div></div>
          <div id="spark"></div>
        </div>
        <div class="sec">
          <div class="sec-hd">&#127760; lab &middot; net rx/s</div>
          <div id="ing"><div class="irow"><div class="iname" style="color:#222">loading&hellip;</div></div></div>
        </div>
        <div id="log-sec">
          <div class="sec-hd" style="margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--bdr)">&#9888; error log &middot; 15m</div>
          <div id="log-list"><div class="log-row"><span class="log-msg" style="color:#333">loading&hellip;</span></div></div>
        </div>
      </div>
      <div id="game">
        <iframe src="/doom/" allowfullscreen title="DOOM"></iframe>
        <div id="chart-panel">
          <div id="chart-hd">
            <span>&#9760; doom server &middot; live 5m</span>
            <span class="ch-leg">
              <span><span class="ch-dot" style="background:var(--grn)"></span>cpu%</span>
              <span><span class="ch-dot" style="background:#4488ff"></span>rx kb/s</span>
              <span><span class="ch-dot" style="background:var(--amb)"></span>req/s</span>
            </span>
          </div>
          <canvas id="mchart" height="118"></canvas>
        </div>
      </div>
      <div class="col">
        <div class="sec">
          <div class="sec-hd">&#128225; information about you</div>
          <div id="you-info"><div class="you-row"><span class="you-v" style="color:#333">scanning&hellip;</span></div></div>
        </div>
        <div id="pod-sec">
          <div class="sec-hd" style="margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--bdr)">&#128187; pod roster</div>
          <div id="pods"><div class="prow"><span class="pname" style="color:#333">loading&hellip;</span></div></div>
        </div>
        <div id="footer">auto-refresh every 5s</div>
      </div>
    </div>
    <script>
      var buf = new Array(26).fill(0);

      var NS_COL = {
        'lab':          '#00a848',
        'monitoring':   '#d08000',
        'ingress-nginx':'#4488ff',
        'cert-manager': '#a040d0',
        'kube-system':  '#484848'
      };
      function nsColor(ns){ return NS_COL[ns]||'#606060'; }

      function flagEmoji(cc){
        if(!cc||cc.length!==2) return '🌐';
        return String.fromCodePoint(
          cc.toUpperCase().charCodeAt(0)+127397,
          cc.toUpperCase().charCodeAt(1)+127397);
      }

      function shortPod(n){
        var m;
        m = n.match(/^(.+)-[a-f0-9]{9,10}-[a-z0-9]{4,5}$/);
        if(m) return m[1];
        m = n.match(/^(.+)-(\d+)$/);
        if(m && m[1].length > 2) return m[1]+'-'+m[2];
        m = n.match(/^(.+)-[a-z0-9]{5}$/);
        if(m) return m[1];
        return n;
      }

      function fmtBytes(n){
        if(n==null||isNaN(n)) return '—';
        if(n<1024) return Math.round(n)+'B';
        if(n<1048576) return (n/1024).toFixed(1)+'KB';
        if(n<1073741824) return (n/1048576).toFixed(1)+'MB';
        return (n/1073741824).toFixed(2)+'GB';
      }
      function bar(bi,vi,pct){
        var b=document.getElementById(bi);
        b.style.width=pct+'%';
        b.className='bf'+(pct>=85?' c':pct>=65?' w':'');
        document.getElementById(vi).textContent=pct+'%';
      }

      function statVal(id,val,warn,crit){
        var el=document.getElementById(id);
        el.textContent=val;
        el.className='sv'+(parseFloat(val)>=crit?' crit':parseFloat(val)>=warn?' warn':' ok');
      }

      function drawSpark(){
        var el=document.getElementById('spark');
        var mx=Math.max.apply(null,buf.concat([0.0001]));
        el.innerHTML=buf.map(function(v){
          return '<div class="sb" style="height:'+Math.max(2,(v/mx*38)).toFixed(1)+'px"></div>';
        }).join('');
      }

      function renderPods(list){
        if(!list||!list.length){
          document.getElementById('pods').innerHTML='<div class="prow"><span class="pname" style="color:#333">no data</span></div>';
          return;
        }
        var byNs={};
        list.forEach(function(p){ if(!byNs[p.ns]) byNs[p.ns]=[]; byNs[p.ns].push(p); });
        var html='';
        Object.keys(byNs).sort().forEach(function(ns){
          var pods=byNs[ns], col=nsColor(ns);
          html+='<div class="pgrp">';
          html+='<div class="pgrp-hd" style="color:'+col+'"><span>'+ns+'</span><span class="pgrp-ct">'+pods.length+'</span></div>';
          pods.forEach(function(p){
            var dc=p.phase==='Running'?'run':(p.phase==='Pending'?'pend':'fail');
            html+='<div class="prow"><span class="pdot '+dc+'"></span><span class="pname">'+shortPod(p.pod)+'</span></div>';
          });
          html+='</div>';
        });
        document.getElementById('pods').innerHTML=html;
      }

      var lastChart = null;
      function drawChart(chart){
        var cv = document.getElementById('mchart');
        if(!cv) return;
        var W = cv.offsetWidth;
        if(W < 10) return;
        var H = parseInt(cv.getAttribute('height') || '118');
        cv.width = W;
        var ctx = cv.getContext('2d');
        ctx.clearRect(0, 0, W, H);
        var padB = 12;
        var drawH = H - padB;
        // grid lines
        [25, 50, 75].forEach(function(pct){
          ctx.strokeStyle = '#1c1c1c';
          ctx.lineWidth = 1;
          var y = Math.round((1 - pct / 100) * drawH) + 0.5;
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
          ctx.fillStyle = '#2e2e2e'; ctx.font = '8px monospace';
          ctx.fillText(pct + '%', 2, y - 2);
        });
        // time axis labels
        var ref = (chart && chart.cpu && chart.cpu.length) ? chart.cpu : (chart && chart.mem ? chart.mem : []);
        if(ref.length >= 2){
          ctx.fillStyle = '#2a2a2a'; ctx.font = '8px monospace';
          ctx.textAlign = 'left';  ctx.fillText('5m ago', 2, H - 2);
          ctx.textAlign = 'right'; ctx.fillText('now', W - 2, H - 2);
          ctx.textAlign = 'left';
        }
        if(!chart) return;
        function drawSeries(points, maxVal, color, fillColor){
          if(!points || !points.length) return;
          var ts0 = points[0][0], ts1 = points[points.length - 1][0], rng = ts1 - ts0 || 1;
          function px(p){ return (p[0] - ts0) / rng * W; }
          function py(p){ var v = Math.min(Math.max(p[1], 0), maxVal); return (1 - v / maxVal) * drawH + 1; }
          // area fill
          ctx.beginPath();
          ctx.moveTo(px(points[0]), drawH + 1);
          points.forEach(function(p){ ctx.lineTo(px(p), py(p)); });
          ctx.lineTo(px(points[points.length - 1]), drawH + 1);
          ctx.closePath();
          ctx.fillStyle = fillColor; ctx.fill();
          // glow line
          ctx.beginPath();
          points.forEach(function(p, i){
            i === 0 ? ctx.moveTo(px(p), py(p)) : ctx.lineTo(px(p), py(p));
          });
          ctx.strokeStyle = color; ctx.lineWidth = 1.5;
          ctx.shadowBlur = 6; ctx.shadowColor = color;
          ctx.stroke(); ctx.shadowBlur = 0;
        }
        // doom network Rx -- auto-scaled bytes/s
        var drx = chart.doom_rx || [];
        var drxMax = drx.reduce(function(a, p){ return Math.max(a, p[1]); }, 1);
        drawSeries(drx, drxMax, '#3366cc', 'rgba(51,102,204,0.08)');
        // doom CPU% -- fixed 0-100 scale, drawn on top
        drawSeries(chart.doom_cpu || [], 100, '#00a848', 'rgba(0,168,72,0.11)');
      }
      function uaInfo(){
        var ua=navigator.userAgent, br='Unknown', os='Unknown', m;
        if(/Windows NT 10/.test(ua)) os='Windows 10/11';
        else if((m=ua.match(/Windows NT ([0-9.]+)/))) os='Windows '+m[1];
        else if((m=ua.match(/Mac OS X ([0-9_]+)/))) os='macOS '+m[1].replace(/_/g,'.');
        else if((m=ua.match(/Android ([0-9.]+)/))) os='Android '+m[1];
        else if((m=ua.match(/(?:iPhone|iPad).*?OS ([0-9_]+)/))) os='iOS '+m[1].replace(/_/g,'.');
        else if(/CrOS/.test(ua)) os='ChromeOS';
        else if(/Linux/.test(ua)) os='Linux';
        if((m=ua.match(/Edg\/([0-9.]+)/))) br='Edge '+m[1];
        else if((m=ua.match(/OPR\/([0-9.]+)/))) br='Opera '+m[1];
        else if((m=ua.match(/Firefox\/([0-9.]+)/))) br='Firefox '+m[1];
        else if((m=ua.match(/Chrome\/([0-9.]+)/))) br='Chrome '+m[1];
        else if((m=ua.match(/Version\/([0-9.]+).*Safari/))) br='Safari '+m[1];
        return {browser:br, os:os};
      }

      function youRow(k,v,cls){
        if(v==null||v==='') return '';
        return '<div class="you-row"><span class="you-k">'+k+'</span>'+
               '<span class="you-v'+(cls?' '+cls:'')+'">'+v+'</span></div>';
      }

      async function loadYou(){
        var net = navigator.connection||{};
        var u = uaInfo();
        var rows = '';
        // server-side bits (IP + geo) — fetched, then client-side bits appended
        try{
          var w = await fetch('/whoami').then(function(r){return r.json();});
          rows += youRow('IP address', w.ip, 'ip');
          var loc = [w.city, w.region, w.country].filter(Boolean).join(', ');
          if(loc) rows += youRow('Location', (w.flag?w.flag+' ':'')+loc, 'hl');
          rows += youRow('ISP', w.isp);
          rows += youRow('ASN', w.asn);
          if(w.timezone) rows += youRow('IP timezone', w.timezone);
        }catch(e){
          rows += youRow('IP address', 'lookup failed');
        }
        // client-side bits
        rows += youRow('Browser', u.browser, 'hl');
        rows += youRow('OS', u.os);
        rows += youRow('Screen', screen.width+'×'+screen.height+
                       (window.devicePixelRatio>1?' @'+window.devicePixelRatio+'x':''));
        rows += youRow('Viewport', window.innerWidth+'×'+window.innerHeight);
        rows += youRow('Color depth', screen.colorDepth+'-bit');
        try{ rows += youRow('Timezone', Intl.DateTimeFormat().resolvedOptions().timeZone); }catch(e){}
        rows += youRow('Language', navigator.language||(navigator.languages||[])[0]);
        if(navigator.hardwareConcurrency) rows += youRow('CPU cores', navigator.hardwareConcurrency);
        if(navigator.deviceMemory) rows += youRow('Memory', '≥'+navigator.deviceMemory+' GB');
        if(net.effectiveType) rows += youRow('Network', net.effectiveType+
                       (net.downlink?' · '+net.downlink+' Mbps':''));
        rows += youRow('Touch points', navigator.maxTouchPoints||0);
        rows += youRow('Cookies', navigator.cookieEnabled?'enabled':'disabled');
        document.getElementById('you-info').innerHTML = rows ||
          '<div class="you-row"><span class="you-v" style="color:#555">unavailable</span></div>';
      }

      async function tick(){
        try{
          var d=await fetch('/metrics-data').then(function(r){return r.json();});
          if(d.cpu!=null){
            bar('cpu-b','cpu-v',Math.round(d.cpu));
            statVal('sc-cpu',Math.round(d.cpu)+'%',65,85);
          }
          if(d.mem!=null){
            bar('mem-b','mem-v',Math.round(d.mem));
            statVal('sc-mem',Math.round(d.mem)+'%',65,85);
          }
          if(d.pods!=null){
            var ep=document.getElementById('sc-pods');
            ep.textContent=Math.round(d.pods);ep.className='sv';
          }
          if(d.nodes!=null){
            var en=document.getElementById('sc-nodes');
            en.textContent=Math.round(d.nodes);en.className='sv';
          }
          var rv=d.rps||0;
          document.getElementById('rps').textContent=fmtBytes(rv)+'/s';
          buf.push(rv);buf.shift();drawSpark();
          document.getElementById('h5').textContent=fmtBytes(d.hits5m||0);
          document.getElementById('h1').textContent=fmtBytes(d.hits1h||0);
          renderPods(d.pod_list);
          if(d.uptime&&d.uptime.length){
            document.getElementById('uk-list').innerHTML=d.uptime.map(function(m){
              var dc=m.status===1?'up':(m.status===0?'down':'unk');
              var ping=m.ping!=null?m.ping+'ms':'—';
              var up=m.up24!=null?m.up24.toFixed(1)+'%':'';
              var nameEl=m.url
                ?'<a href="'+m.url+'" target="_blank" rel="noopener" class="uk-name">'+m.name+'</a>'
                :'<span class="uk-name">'+m.name+'</span>';
              return '<div class="uk-row">'+
                '<span class="uk-dot '+dc+'"></span>'+
                nameEl+
                '<span class="uk-ping">'+ping+'</span>'+
                '<span class="uk-up">'+up+'</span></div>';
            }).join('');
          } else if(d.uptime){
            document.getElementById('uk-list').innerHTML=
              '<div class="uk-row"><span class="uk-name" style="color:#555">no monitors yet</span></div>';
          }
          if(d.chart){ lastChart = d.chart; drawChart(d.chart); }
          if(d.logs!=null){
            document.getElementById('log-list').innerHTML=d.logs.length
              ?d.logs.map(function(l){
                  return '<div class="log-row">'+
                    '<span class="log-lvl '+l.lvl+'">'+(l.lvl==='err'?'E':'W')+'</span>'+
                    '<span class="log-ts">'+l.ts+'</span>'+
                    '<span class="log-ns" style="color:'+nsColor(l.ns)+'">'+l.ns+'</span>'+
                    '<span class="log-msg">'+l.msg+'</span></div>';
                }).join('')
              :'<div class="log-row"><span class="log-msg" style="color:#444">no recent errors</span></div>';
          }
          var ings=d.ingress||[];
          document.getElementById('ing').innerHTML=ings.length
            ?ings.map(function(r){
                return '<div class="irow"><div class="iname">'+(r.pod||'unknown')+
                  '</div><div class="irps">'+fmtBytes(r.rx)+'/s</div></div>';
              }).join('')
            :'<div class="irow"><div class="iname" style="color:#333">no traffic yet</div></div>';
          document.getElementById('dot').className='dot';
          document.getElementById('sts').textContent='ONLINE';
          var t=new Date().toLocaleTimeString();
          document.getElementById('ts').textContent=t;
          document.getElementById('footer').textContent='updated '+t+' · every 5s';
        }catch(e){
          document.getElementById('dot').className='dot err';
          document.getElementById('sts').textContent='ERROR';
          console.error(e);
        }
      }
      drawSpark();drawChart(null);tick();loadYou();setInterval(tick,5000);
    </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doom-dashboard
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doom-dashboard
  template:
    metadata:
      labels:
        app: doom-dashboard
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports:
        - containerPort: 8080
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: html
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
        - name: tmp
          mountPath: /tmp
      - name: metrics
        image: python:3.12-alpine
        command: ["python3", "/app/metrics_server.py"]
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: UPTIME_KUMA_API_KEY
          valueFrom:
            secretKeyRef:
              name: uptimekuma-creds
              key: UPTIME_KUMA_API_KEY
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 20m
            memory: 24Mi
          limits:
            cpu: 50m
            memory: 48Mi
        volumeMounts:
        - name: metrics-script
          mountPath: /app
          readOnly: true
      volumes:
      - name: nginx-config
        configMap:
          name: doom-dashboard-nginx
      - name: html
        configMap:
          name: doom-dashboard-html
      - name: metrics-script
        configMap:
          name: doom-dashboard-metrics
          defaultMode: 0444
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: doom-dashboard
  namespace: lab
spec:
  selector:
    app: doom-dashboard
  ports:
  - port: 80
    targetPort: 8080
